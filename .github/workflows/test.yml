name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: './go.mod'
          cache: true

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Get dependencies
        run: go mod tidy

      - name: Check module is tidy
        run: git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -timeout 120s

      - name: Build ARM binary
        run: make arm-build

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-box-arm
          path: dns-box
          retention-days: 7

  release:
    # Релиз только на пуш в main и только если тесты прошли
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: dns-box-arm

      - name: Make binary executable
        run: chmod +x dns-box

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      - name: Compress binary with UPX
        run: upx --best --lzma ./dns-box

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          gh auth status

      - name: Create release with incremented tag
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')

          if [[ -z "$LATEST_TAG" ]]; then
            NEW_TAG="v1.0.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          COMMIT_HASH=$(git rev-parse --short HEAD)

          gh release create "$NEW_TAG" \
            ./dns-box \
            --title "$NEW_TAG" \
            --notes "Release created from commit $COMMIT_HASH. This release was automatically generated by GitHub Actions."

          git tag -f latest
          git push -f origin latest
